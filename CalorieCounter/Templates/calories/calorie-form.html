{% extends 'master/base.html' %}


{% block body %}
<h1>{{form_title}}</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
  <div class="mb-3">
    <label for="" class="form-label">Item Name</label>
    <input type="text" class="form-control" name="item_name" value="{{calorie_data.item_name}}">
  </div>
  <div class="mb-3">
    <label for="" class="form-label">Calorie</label>
    <input type="number" class="form-control" name="calorie" value="{{calorie_data.calorie}}">
  </div>
  <button type="submit" class="btn btn-primary">{{form_btn}}</button>
</form>
{% endblock body %}
